name: Publish Host

# Builds the distributable dcc-office-host (single-file, self-contained
# win-x64). Downstream adapters (dcc-mcp-PowerPoint packaging) consume this
# artifact — the dependency build lives here, not ad hoc downstream.

on:
  push:
    branches: [main]
    paths:
      - "dotnet/**"
      - ".github/workflows/publish-host.yml"
  pull_request:
    paths:
      - "dotnet/**"
      - ".github/workflows/publish-host.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup vx (.NET 8 LTS SDK from vx.toml)
        uses: loonghao/vx@vx-v0.9.28
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          setup: "true"

      - name: Publish single-file host (zero NuGet dependencies)
        shell: pwsh
        run: vx run publish -- -o "$env:RUNNER_TEMP\host"

      - name: Smoke test with explicit COM probe
        shell: pwsh
        run: '& "$env:RUNNER_TEMP\host\dcc-office-host.exe" --app=powerpoint --self-test-com'

      - name: Upload host artifact
        uses: actions/upload-artifact@v4
        with:
          name: dcc-office-host-win-x64
          path: ${{ runner.temp }}/host/dcc-office-host.exe
          retention-days: 30
