name: Publish Host

# Builds a verification preview of the self-contained win-x64 release bundle.
# The durable downstream channel is the versioned GitHub Release, not this
# short-lived CI artifact.

on:
  push:
    branches: [main]
    paths:
      - "dotnet/**"
      - "crates/office-mcp-server/**"
      - "crates/office-client/**"
      - "crates/office-protocol/**"
      - "crates/office-security/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "manifests/**"
      - "templates/**"
      - "docs/distribution.md"
      - "docs/operations.md"
      - "scripts/package_release.py"
      - ".github/workflows/publish-host.yml"
  pull_request:
    paths:
      - "dotnet/**"
      - "crates/office-mcp-server/**"
      - "crates/office-client/**"
      - "crates/office-protocol/**"
      - "crates/office-security/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "manifests/**"
      - "templates/**"
      - "docs/distribution.md"
      - "docs/operations.md"
      - "scripts/package_release.py"
      - ".github/workflows/publish-host.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup vx (.NET 8 LTS SDK from vx.toml)
        uses: loonghao/vx@vx-v0.9.28
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          setup: "true"
      - uses: dtolnay/rust-toolchain@stable

      - name: Build reference stdio MCP server
        run: cargo build --locked --release -p dcc-mcp-office-mcp-server

      - name: Smoke test MCP server entry point
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\target\release\dcc-mcp-office-mcp-server.exe" --help'

      - name: Publish single-file host (zero NuGet dependencies)
        shell: pwsh
        run: vx run publish -- -o "$env:RUNNER_TEMP\host"

      - name: Smoke test with explicit COM probe
        shell: pwsh
        run: '& "$env:RUNNER_TEMP\host\dcc-office-host.exe" --app=powerpoint --self-test-com'

      - name: Build verification release bundle
        shell: pwsh
        run: |
          python scripts/package_release.py --host-dir "$env:RUNNER_TEMP\host" --mcp-server "$env:GITHUB_WORKSPACE\target\release\dcc-mcp-office-mcp-server.exe" --output-dir "$env:RUNNER_TEMP\release"

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: dcc-office-host-win-x64-verification-${{ github.sha }}
          path: ${{ runner.temp }}/release/*
          retention-days: 14
