name: Release

# Automated releases via release-please (conventional commits).
#
# Every push to main runs release-please, which keeps a release PR up to date.
# When that PR is merged, release-please creates the GitHub release and tag;
# this workflow publishes a verified, self-describing Office Host bundle onto
# that durable release. Rust consumers pin the same immutable tag.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag whose assets should be republished
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # A PAT (user-owned) is required: PRs opened with the default
          # GITHUB_TOKEN do not trigger pull_request workflows, so CI would
          # never run on release PRs.
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-release-assets:
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || needs.release-please.outputs.tag_name }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Validate target release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag: $env:RELEASE_TAG"
          }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.sha }}

      - name: Verify target GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$env:RELEASE_TAG" --repo dcc-mcp/dcc-mcp-office

      - name: Setup vx (.NET 8 LTS SDK from vx.toml)
        uses: loonghao/vx@vx-v0.9.28
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          setup: "true"
      - uses: dtolnay/rust-toolchain@stable

      - name: Build reference stdio MCP server
        run: cargo build --locked --release -p dcc-mcp-office-mcp-server

      - name: Smoke test MCP server entry point
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\target\release\dcc-mcp-office-mcp-server.exe" --help'

      - name: Publish single-file host (zero NuGet dependencies)
        shell: pwsh
        run: vx run publish -- -o "$env:RUNNER_TEMP\host"

      - name: Smoke test with explicit COM probe
        shell: pwsh
        run: '& "$env:RUNNER_TEMP\host\dcc-office-host.exe" --app=powerpoint --self-test-com'

      - name: Build release bundle
        id: bundle
        shell: pwsh
        run: |
          $version = ($env:RELEASE_TAG).TrimStart("v")
          python scripts/package_release.py --host-dir "$env:RUNNER_TEMP\host" --mcp-server "$env:GITHUB_WORKSPACE\target\release\dcc-mcp-office-mcp-server.exe" --output-dir "$env:RUNNER_TEMP\release" --version $version
          $archive = "$env:RUNNER_TEMP\release\dcc-mcp-office-host-$version-win-x64.zip"
          $sbom = "$env:RUNNER_TEMP\release\dcc-mcp-office-host-$version.spdx.json"
          if (-not (Test-Path -LiteralPath $archive)) { throw "Release archive not found: $archive" }
          if (-not (Test-Path -LiteralPath $sbom)) { throw "Release SBOM not found: $sbom" }
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "sbom=$sbom" >> $env:GITHUB_OUTPUT

      - name: Verify release checksums
        shell: pwsh
        run: |
          $release = "$env:RUNNER_TEMP\release"
          foreach ($line in Get-Content -LiteralPath "$release\SHA256SUMS") {
            $digest, $name = $line -split "  ", 2
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath "$release\$name").Hash.ToLowerInvariant()
            if ($actual -ne $digest) { throw "SHA-256 mismatch for $name" }
          }

      - name: Attest release build provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/release/*

      - name: Attest package SBOM
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.bundle.outputs.archive }}
          sbom-path: ${{ steps.bundle.outputs.sbom }}

      - name: Upload assets and checksums to the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG
          $assets = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\release" -File | ForEach-Object FullName
          gh release upload $tag $assets --clobber --repo dcc-mcp/dcc-mcp-office
          $body = gh release view $tag --json body --jq .body --repo dcc-mcp/dcc-mcp-office
          $marker = "<!-- dcc-office-checksums -->"
          $prefix = ($body -split [regex]::Escape($marker), 2)[0].TrimEnd()
          $checksums = Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP\release\SHA256SUMS"
          $fence = [string]::new([char]96, 3)
          $notes = "$prefix`n`n$marker`n### SHA-256 checksums`n`n${fence}text`n$checksums${fence}`n"
          $notesPath = "$env:RUNNER_TEMP\release-notes.md"
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          gh release edit $tag --notes-file $notesPath --repo dcc-mcp/dcc-mcp-office
