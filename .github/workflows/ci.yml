name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Fmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: python -m pip install openpyxl dcc-mcp-server
      - name: Skill lint (official dcc-mcp-cli validator)
        run: dcc-mcp-cli lint skills --warnings-as-errors --non-interactive
      - name: Dashboard e2e
        run: |
          python skills/office-generate-production-dashboard/scripts/generate_dashboard.py             --input examples/capability-dashboard.json --out /tmp/dash
          test -s /tmp/dash/draft-dcc-mcp-capability-dashboard.xlsx
