name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Fmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: python -m pip install openpyxl
      - name: Skill lint (official dcc-mcp-cli validator)
        run: |
          # dcc-mcp-cli ships through the dcc-mcp-core release train, not pip.
          curl -fL -o "$RUNNER_TEMP/dcc-mcp-cli" "https://github.com/dcc-mcp/dcc-mcp-core/releases/download/v0.20.6/dcc-mcp-cli-linux-x86_64"
          chmod +x "$RUNNER_TEMP/dcc-mcp-cli"
          "$RUNNER_TEMP/dcc-mcp-cli" lint skills --warnings-as-errors --non-interactive
      - name: Dashboard e2e
        run: |
          python skills/office-generate-production-dashboard/scripts/generate_dashboard.py             --input examples/capability-dashboard.json --out /tmp/dash
          test -s /tmp/dash/draft-dcc-mcp-capability-dashboard.xlsx

  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build (zero NuGet dependencies)
        run: dotnet build dotnet/Office.Automation.Host/Office.Automation.Host.csproj -v q
      - name: Host self-test (compile + inspect round-trip)
        run: dotnet run --project dotnet/Office.Automation.Host/Office.Automation.Host.csproj --no-build -- --app=powerpoint --self-test
