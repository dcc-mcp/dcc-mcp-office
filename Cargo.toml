[workspace]
resolver = "2"
members = [
    "crates/office-protocol",
    "crates/office-ir",
    "crates/office-client",
    "crates/office-tools",
    "crates/office-jobs",
    "crates/office-graph",
    "crates/office-security",
    "crates/office-testkit",
    "crates/office-mcp-server",
]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/dcc-mcp/dcc-mcp-office"
rust-version = "1.88"

[workspace.dependencies]
dcc-mcp-office-protocol = { version = "0.2.2", path = "crates/office-protocol" }
dcc-mcp-office-client = { version = "0.2.2", path = "crates/office-client" }
dcc-mcp-office-security = { version = "0.2.2", path = "crates/office-security" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "=3.1.4", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "rt-multi-thread"] }

[profile.release]
lto = "thin"
