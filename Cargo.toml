[workspace]
resolver = "2"
members = [
    "crates/office-protocol",
    "crates/office-ir",
    "crates/office-client",
    "crates/office-tools",
    "crates/office-jobs",
    "crates/office-graph",
    "crates/office-security",
    "crates/office-testkit",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/dcc-mcp/dcc-mcp-office"
rust-version = "1.81"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
